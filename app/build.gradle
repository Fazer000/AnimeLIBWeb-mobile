plugins {
    alias(libs.plugins.android.application)
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.animelib'
    compileSdk 35

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.example.animelib"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "1.5.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def outputFileName = ""
            if (buildType === "debug") {
                outputFileName = "AnimeLib-v${versionName}-${buildType}.apk"
            } else {
                outputFileName = "AnimeLib-v${versionName}.apk"
            }
            outputFileName = outputFileName.replace("debug", "debug").replace("release", "release")
            output.outputFileName = outputFileName
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.okhttp
    implementation libs.appcompat
    implementation libs.material
    implementation libs.gson
    implementation libs.room.runtime
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.media3.exoplayer.hls
    annotationProcessor libs.room.compiler
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.swiperefreshlayout
    implementation libs.core
    implementation libs.media3.exoplayer
    implementation libs.media3.ui
    implementation libs.media3.common
    implementation libs.media3.datasource.okhttp
    implementation libs.jsoup
    implementation libs.core.splashscreen
}